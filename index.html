<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Repositório Mineral</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>

/* =========================
RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:system-ui,sans-serif;
}

/* =========================
MODEL VIEWER
========================= */

model-viewer{
  width:100vw;
  height:100vh;
  background:#000;
}

/* =========================
BOTÃO AR
========================= */

#ar-button{

  position:absolute;

  left:50%;
  transform:translateX(-50%);

  bottom:14px;

  display:flex;
  align-items:center;
  gap:8px;

  height:42px;

  padding:0 16px;

  border:none;
  border-radius:999px;

  background:#ffffff;

  color:#4285f4;

  font-size:13px;
  font-weight:600;

  z-index:20;

  cursor:pointer;
}

#ar-button img{
  width:18px;
  height:18px;
}

/* =========================
SLIDER
========================= */

.slider{

  position:absolute;

  right:10px;
  bottom:70px;

  max-width:92vw;

  z-index:10;

  pointer-events:none;
}

.slides{

  display:flex;

  gap:8px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:4px;

  scrollbar-width:none;

  pointer-events:auto;
}

.slides::-webkit-scrollbar{
  display:none;
}

/* =========================
THUMBNAILS
========================= */

.slide{

  width:58px;
  height:58px;

  flex-shrink:0;

  border-radius:12px;

  border:2px solid rgba(255,255,255,.15);

  background-size:cover;
  background-position:center;
  background-color:#1a1a1a;

  cursor:pointer;
}

.slide.selected{
  border:2px solid #4285f4;
}

/* =========================
MOBILE
========================= */

@media (max-width:600px){

  .slide{
    width:54px;
    height:54px;
  }

  .slider{
    bottom:66px;
  }

}

</style>
</head>

<body>

<model-viewer

  id="viewer"

  src="./models/CalcitaPancake.glb"

  poster="./models/Calcita.png"

  camera-controls

  disable-pan

  interaction-prompt="none"

  loading="lazy"

  reveal="auto"

  exposure="1"

  alt="Modelo mineral 3D"

  ar

  ar-modes="scene-viewer webxr quick-look"
>

  <!-- =========================
  BOTÃO AR
  ========================= -->

  <button slot="ar-button" id="ar-button">

    <img src="./icons/ar.svg">

    Ver no espaço

  </button>

  <!-- =========================
  SLIDER
  ========================= -->

  <div class="slider">

    <div class="slides" id="slides"></div>

  </div>

</model-viewer>

<script type="module">

/* =========================
MODELOS
========================= */

const MODELS = [

  {

    name:'Calcita',

    glb:'./models/CalcitaPancake.glb',

    poster:'./models/Calcita.png'

  },

  {

    name:'Robô',

    glb:'./models/RobotExpressive.glb',

    poster:'./models/Robot.webp'

  },

  {

    name:'Cavalo',

    glb:'./models/Horse.glb',

    poster:'./models/Horse.webp'

  }

];

/* =========================
ELEMENTOS
========================= */

const viewer =
document.getElementById('viewer');

const slides =
document.getElementById('slides');

let currentIndex = 0;

/* =========================
CRIAR THUMBNAILS
========================= */

MODELS.forEach((model,index)=>{

  const btn =
  document.createElement('button');

  btn.className = 'slide';

  if(index === 0){

    btn.classList.add('selected');

  }

  btn.style.backgroundImage =
  `url(${model.poster})`;

  btn.title = model.name;

  btn.setAttribute(
    'aria-label',
    model.name
  );

  btn.addEventListener('click',()=>{

    if(currentIndex === index) return;

    currentIndex = index;

    /* remove poster anterior */

    viewer.dismissPoster();

    /* troca modelo */

    viewer.src = model.glb;

    viewer.poster = model.poster;

    /* atualiza thumb */

    document
      .querySelectorAll('.slide')
      .forEach(el=>{

        el.classList.remove('selected');

      });

    btn.classList.add('selected');

  });

  slides.appendChild(btn);

});

/* =========================
FIX XR
========================= */

document
.querySelector('.slider')
.addEventListener(
  'beforexrselect',
  (e)=>{

    e.preventDefault();

  }
);

/* =========================
CHECK AR
========================= */

window.addEventListener(
  'load',
  ()=>{

    const supported =

      navigator.xr ||

      /android|iphone|ipad/i
      .test(navigator.userAgent);

    if(!supported){

      console.warn('AR não suportado');

      document
      .getElementById('ar-button')
      .style.display='none';

    }else{

      console.log('AR disponível');

    }

  }
);

</script>

</body>
</html>
