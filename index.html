<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>3D Model Carousel with AR</title>
  <!-- Import model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    /* Your existing CSS – keep it exactly as before but I'll include essential parts */
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f7; font-family: system-ui, Roboto, sans-serif; }
    model-viewer {
      width: 100%;
      height: 70vh;
      background-color: #eef2f5;
    }
    #ar-button {
      background-image: url('https://fonts.gstatic.com/s/i/googlematerialicons/view_in_ar/v13/24px.svg');
      background-repeat: no-repeat;
      background-size: 20px 20px;
      background-position: 12px 50%;
      background-color: white;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 132px;
      padding: 0 16px 0 40px;
      font-size: 14px;
      font-weight: 500;
      color: #4285f4;
      height: 36px;
      line-height: 36px;
      border-radius: 18px;
      border: 1px solid #dadce0;
      cursor: pointer;
      z-index: 20;
      white-space: nowrap;
    }
    /* AR prompt animation */
    @keyframes circle {
      from { transform: translateX(-50%) rotate(0deg) translateX(50px) rotate(0deg); }
      to   { transform: translateX(-50%) rotate(360deg) translateX(50px) rotate(-360deg); }
    }
    @keyframes elongate {
      from { transform: translateX(100px); }
      to   { transform: translateX(-100px); }
    }
    model-viewer > #ar-prompt {
      position: absolute;
      left: 50%;
      bottom: 175px;
      animation: elongate 2s infinite ease-in-out alternate;
      display: none;
      z-index: 20;
    }
    model-viewer[ar-status="session-started"] > #ar-prompt {
      display: block;
    }
    model-viewer > #ar-prompt > img {
      animation: circle 4s linear infinite;
      width: 50px;
      height: 50px;
    }
    model-viewer > #ar-failure {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 175px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 14px;
      display: none;
      z-index: 20;
    }
    model-viewer[ar-tracking="not-tracking"] > #ar-failure {
      display: block;
    }
    .slider {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      overflow: hidden;
      pointer-events: none;
    }
    .slides {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 10px;
      padding: 8px 16px;
      pointer-events: auto;
      justify-content: center;
    }
    .slide {
      scroll-snap-align: start;
      flex-shrink: 0;
      width: 85px;
      height: 85px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: white;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .slide.selected { border-color: #4285f4; }
  </style>
</head>
<body>

<model-viewer
  id="model-viewer"
  src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
  poster="https://modelviewer.dev/shared-assets/models/Astronaut.webp"
  shadow-intensity="1"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  touch-action="pan-y"
>
  <button slot="ar-button" id="ar-button">
    View in your space
  </button>
  <div id="ar-prompt">
    <!-- ✅ ABSOLUTE URL – no more 404 -->
    <img src="https://modelviewer.dev/shared-assets/icons/hand.png" alt="move phone">
  </div>
  <button id="ar-failure">
    AR is not tracking
  </button>

  <div class="slider">
    <div class="slides" id="slide-list"></div>
  </div>
</model-viewer>

<script type="module">
  // Replace these with YOUR actual models from your GitHub repo
  const MODELS = [
    { name: 'Astronaut', glb: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb', poster: 'https://modelviewer.dev/shared-assets/models/Astronaut.webp' },
    { name: 'Robot', glb: 'https://modelviewer.dev/shared-assets/models/RobotExpressive.glb', poster: 'https://modelviewer.dev/shared-assets/models/RobotExpressive.webp' },
    { name: 'Horse', glb: 'https://modelviewer.dev/shared-assets/models/Horse.glb', poster: 'https://modelviewer.dev/shared-assets/models/Horse.webp' },
    // Add your own: { name: 'Chair', glb: './assets/ShopifyModels/Chair.glb', poster: './assets/ShopifyModels/Chair.webp' }
  ];

  const modelViewer = document.getElementById('model-viewer');
  const slidesContainer = document.getElementById('slide-list');

  MODELS.forEach((model, idx) => {
    const btn = document.createElement('button');
    btn.className = 'slide' + (idx === 0 ? ' selected' : '');
    btn.style.backgroundImage = `url('${model.poster}')`;
    btn.addEventListener('click', () => {
      modelViewer.src = model.glb;
      modelViewer.poster = model.poster;
      document.querySelectorAll('.slide').forEach(s => s.classList.remove('selected'));
      btn.classList.add('selected');
    });
    slidesContainer.appendChild(btn);
  });

  document.querySelector('.slider').addEventListener('beforexrselect', (e) => e.preventDefault());
</script>

</body>
</html>
