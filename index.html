<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizador 3D e Índice de Modelos</title>
    <!-- Carregamento do Tailwind CSS para estilo moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuração do Tailwind para usar a fonte Inter -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Estilo base para garantir que o canvas ocupe todo o espaço do visualizador */
        body, html, #viewer-container {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<!-- MUDANÇA: Fundo do corpo alterado para cinza escuro (quase preto) -->
<body class="bg-gray-900">

    <!-- ÍNDICE DE MODELOS -->
    <div id="model-list" class="min-h-screen p-8 md:p-12 lg:p-16">
        <!-- MUDANÇA: Cor do título alterada para branco para alto contraste -->
        <h1 class="text-4xl font-extrabold text-white mb-8 text-center">
            Catálogo de Modelos 3D
        </h1>
        
        <!-- O grid será populado via JavaScript -->
        <div id="model-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Conteúdo dinâmico aqui -->
        </div>
    </div>

    <!-- VISUALIZADOR 3D -->
    <div id="viewer-container" class="hidden relative w-full h-screen">
        <!-- O canvas será anexado aqui -->
        
        <!-- Botão Voltar -->
        <button id="back-button" class="absolute top-4 left-4 z-10 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg shadow-lg transition duration-150 ease-in-out flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0.25 0.25 23.5 23.5" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 mr-2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
            Voltar ao Catálogo
        </button>
        
        <!-- Controles de Status (Carregamento e Erro) -->
        <div id="loading" class="absolute top-16 left-4 z-10 bg-white p-3 rounded-lg shadow-md font-medium text-gray-700 transition duration-300">
            Carregando...
        </div>
        <div id="error" class="absolute top-16 left-4 z-10 bg-red-100 border border-red-400 text-red-700 p-3 rounded-lg shadow-md font-medium hidden">
            Ocorreu um erro no carregamento.
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/DRACOLoader.js';
        
        // ===========================================
        // 1. DADOS DOS MODELOS (AGORA COM CAMINHOS RELATIVOS)
        // Você deve garantir que esses arquivos existam na estrutura de pastas correta
        // ===========================================
        const MODELS_DATA = [
            {
                id: 'model-a',
                name: 'Calcita Original',
                gltfUrl: './CalcitaPancakeBase.glb', // Caminho relativo para o seu modelo original
                thumbnailUrl: './images/calcita_original.png', // Caminho relativo para a miniatura
                description: 'Seu modelo original Calcita, otimizado para visualização com alta exposição.',
            },
            {
                id: 'model-b',
                name: 'APF1',
                gltfUrl: './models/APF1-v1.glb', // Exemplo de modelo em uma subpasta 'models'
                thumbnailUrl: './images/APF1-v1.png',
                description: 'Um robô amigável, pronto para ser inspecionado.',
            },
            {
                id: 'model-c',
                name: 'Capacete de Voo',
                gltfUrl: './models/FlightHelmet.gltf',
                thumbnailUrl: './images/capacete_voo.png',
                description: 'Um modelo complexo PBR para testar materiais.',
            },
            {
                id: 'model-d',
                name: 'Sala Viking',
                gltfUrl: './models/VikingRoom.gltf',
                thumbnailUrl: './images/sala_viking.png',
                description: 'Cena completa para testar iluminação ambiente.',
            },
        ];

        // ===========================================
        // 2. VARIÁVEIS DE DOM E ESTADO
        // ===========================================
        const modelListElement = document.getElementById('model-list');
        const modelGridElement = document.getElementById('model-grid');
        const viewerContainer = document.getElementById('viewer-container');
        const loadingElement = document.getElementById('loading');
        const errorElement = document.getElementById('error');
        const backButton = document.getElementById('back-button');

        let scene, camera, renderer, controls, currentModel, ambientLight, directionalLight, fillLight;
        let animationFrameId = null;

        // ===========================================
        // 3. FUNÇÕES DE GERENCIAMENTO DE VIEW
        // ===========================================

        /**
         * Alterna para a visualização do catálogo (Índice).
         */
        function showIndex() {
            // Esconde o visualizador
            viewerContainer.classList.add('hidden');
            // Mostra o catálogo
            modelListElement.classList.remove('hidden');

            // Limpa o ambiente Three.js se estiver ativo
            if (renderer) {
                // Para o loop de animação
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                // Remove o canvas para limpar a memória
                const canvas = renderer.domElement;
                if (canvas) {
                    canvas.remove();
                }
                // Limpa a cena e o renderizador (opcional, mas boa prática)
                renderer.dispose();
                scene.clear();
                renderer = null;
                controls = null;
                // O garbage collector fará o resto
            }
        }

        /**
         * Alterna para a visualização 3D e inicia o carregamento do modelo.
         * @param {string} modelUrl - URL do arquivo GLTF/GLB.
         */
        function showViewer(modelUrl) {
            // Esconde o catálogo
            modelListElement.classList.add('hidden');
            // Mostra o visualizador
            viewerContainer.classList.remove('hidden');

            // Limpa mensagens de status
            loadingElement.textContent = 'Carregando...';
            loadingElement.classList.remove('hidden');
            errorElement.classList.add('hidden');
            
            // Inicializa e carrega o modelo
            initThreeJs();
            loadModel(modelUrl);
        }

        // ===========================================
        // 4. FUNÇÕES DE RENDERIZAÇÃO DO ÍNDICE
        // ===========================================

        /**
         * Cria um cartão de miniatura para o modelo.
         * @param {object} model - Objeto de dados do modelo.
         */
        function createModelCard(model) {
            const card = document.createElement('div');
            // Cartão com fundo branco mantido, como solicitado
            card.className = 'bg-white rounded-xl shadow-xl overflow-hidden cursor-pointer hover:shadow-2xl hover:scale-[1.02] transition duration-300 ease-in-out';
            card.onclick = () => showViewer(model.gltfUrl);

            card.innerHTML = `
                <!-- Miniatura -->
                <div class="h-48 overflow-hidden bg-gray-200">
                    <!-- O src agora usa um caminho relativo -->
                    <img src="${model.thumbnailUrl}" alt="Miniatura de ${model.name}" onerror="this.onerror=null;this.src='https://placehold.co/300x200/94A3B8/ffffff?text=Thumbnail+Indispon%C3%ADvel';" 
                         class="w-full h-full object-cover transition-opacity duration-500 hover:opacity-90">
                </div>
                <!-- Detalhes -->
                <div class="p-5">
                    <h3 class="text-xl font-bold text-gray-800 truncate">${model.name}</h3>
                    <p class="text-sm text-gray-500 mt-1 line-clamp-2">${model.description}</p>
                    <button class="mt-4 w-full bg-indigo-500 text-white py-2 rounded-lg font-medium hover:bg-indigo-600 transition">Visualizar 3D</button>
                </div>
            `;
            return card;
        }

        /**
         * Popula o grid do catálogo com os cartões de modelo.
         */
        function renderIndex() {
            modelGridElement.innerHTML = '';
            MODELS_DATA.forEach(model => {
                modelGridElement.appendChild(createModelCard(model));
            });
        }

        // ===========================================
        // 5. SETUP DO THREE.JS (VISUALIZADOR)
        // ===========================================

        /**
         * Configura a cena, câmera, renderizador e controles.
         */
        function initThreeJs() {
            // Se já estiver inicializado, apenas limpa a cena
            if (renderer) {
                scene.clear();
                return;
            }

            // 1. Configuração básica
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.0, 2.5); // Posição de visualização padrão

            // 2. Configuração do Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.physicallyCorrectLights = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.8; // Exposição alta
            renderer.shadowMap.enabled = false;
            
            // Adiciona o canvas ao container
            viewerContainer.appendChild(renderer.domElement);

            // 3. Fundo e Controles
            scene.background = new THREE.Color(0xeeeeee); // Fundo cinza claro para o modelo 3D
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 4. Iluminação (Otimizada para PBR e clareza)
            ambientLight = new THREE.AmbientLight(0xffffff, 1.0); 
            scene.add(ambientLight);

            directionalLight = new THREE.DirectionalLight(0xffffff, 3.0);
            directionalLight.position.set(3, 5, 2);
            scene.add(directionalLight);

            fillLight = new THREE.DirectionalLight(0xffffff, 1.5);
            fillLight.position.set(-3, 2, -2);
            scene.add(fillLight);
            
            // Inicia o loop de animação
            animate();
        }

        /**
         * Carrega o modelo 3D GLTF/GLB na cena.
         * @param {string} modelUrl - URL do arquivo GLTF/GLB.
         */
        function loadModel(modelUrl) {
            // Remove o modelo anterior, se houver
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            // Configuração dos loaders
            const dracoLoader = new DRACOLoader();
            // O caminho do decoder DRACO continua como URL externa
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
            
            const loader = new GLTFLoader();
            loader.setDRACOLoader(dracoLoader);
            
            loadingElement.classList.remove('hidden');

            loader.load(
                modelUrl, // O loader agora usa o caminho relativo
                (gltf) => {
                    // Centraliza o modelo e o ajusta ao tamanho da cena (opcional, mas recomendado)
                    const box = new THREE.Box3().setFromObject(gltf.scene);
                    const center = box.getCenter(new THREE.Vector3());
                    gltf.scene.position.sub(center); // Move o modelo para o centro

                    scene.add(gltf.scene);
                    currentModel = gltf.scene;
                    
                    // Ajuste de Materiais (Mesma lógica do original)
                    gltf.scene.traverse((child) => {
                        if (child.isMesh) {
                            child.material.envMapIntensity = 0.3;
                            child.material.metalness = 0.1;
                            child.material.roughness = 0.7;
                            child.material.needsUpdate = true;
                            
                            // Garante que materiais não-Standard sejam convertidos (se necessário)
                            if (!child.material.isMeshStandardMaterial) {
                                child.material = new THREE.MeshStandardMaterial({
                                    color: child.material.color,
                                    map: child.material.map,
                                    metalness: 0.1,
                                    roughness: 0.7
                                });
                            }
                        }
                    });

                    loadingElement.classList.add('hidden');
                },
                (xhr) => {
                    // Exibe o progresso de carregamento
                    const progress = (xhr.loaded / xhr.total * 100).toFixed(2);
                    loadingElement.textContent = `Carregando: ${progress}%`;
                },
                (error) => {
                    // Lidar com erro
                    console.error('Erro ao carregar o modelo:', error);
                    errorElement.textContent = `Erro ao carregar o modelo: ${error.message}`;
                    errorElement.classList.remove('hidden');
                    loadingElement.classList.add('hidden');
                }
            );
        }

        // ===========================================
        // 6. LOOP DE ANIMAÇÃO E RESPONSIVIDADE
        // ===========================================

        function animate() {
            animationFrameId = requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // ===========================================
        // 7. INICIALIZAÇÃO
        // ===========================================

        // Botão de retorno
        backButton.addEventListener('click', showIndex);
        
        // Renderiza o catálogo ao iniciar a página
        renderIndex();
        
    </script>
</body>
</html>
