<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador GLTF Leve</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 15px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }
        
        h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #4fc3f7;
        }
        
        .subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        #renderCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            background: rgba(44, 62, 80, 0.8);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:hover {
            background: rgba(52, 152, 219, 0.9);
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 5px solid #4fc3f7;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            max-width: 250px;
            backdrop-filter: blur(5px);
            display: none;
        }
        
        .info-panel h3 {
            margin-bottom: 10px;
            color: #4fc3f7;
        }
        
        .stats {
            font-size: 0.85rem;
            line-height: 1.6;
        }
        
        .model-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            max-width: 300px;
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.2rem;
            }
            
            .subtitle {
                font-size: 0.8rem;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 0.8rem;
                min-width: 100px;
            }
            
            .controls {
                padding: 10px;
            }
            
            .model-info {
                font-size: 0.8rem;
                bottom: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Visualizador GLTF para Celulares</h1>
        <div class="subtitle">Modelo 3D otimizado para baixo consumo de recursos</div>
    </div>
    
    <div class="container">
        <div id="canvas-container">
            <canvas id="renderCanvas"></canvas>
            <div class="loading">
                <div class="spinner"></div>
                <div>Carregando modelo 3D...</div>
            </div>
        </div>
        
        <div class="info-panel">
            <h3>Informações do Modelo</h3>
            <div class="stats">
                <div><strong>Vértices:</strong> <span id="vertex-count">0</span></div>
                <div><strong>Triângulos:</strong> <span id="triangle-count">0</span></div>
                <div><strong>Materiais:</strong> <span id="material-count">0</span></div>
                <div><strong>Texturas:</strong> <span id="texture-count">0</span></div>
            </div>
        </div>
        
        <div class="model-info">
            <strong>Modelo:</strong> Astronauta (1.2MB) | <strong>Toque e arraste</strong> para girar
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" id="resetBtn">
            <i>↺</i> Resetar Vista
        </button>
        <button class="btn" id="wireframeBtn">
            <i>▦</i> Wireframe
        </button>
        <button class="btn" id="infoBtn">
            <i>ℹ️</i> Informações
        </button>
    </div>

    <!-- Three.js from CDN (minified) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <!-- GLTFLoader from CDN (minified) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/GLTFLoader.min.js"></script>
    <!-- OrbitControls from CDN (minified) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/controls/OrbitControls.min.js"></script>
    
    <script>
        // Configuração principal
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a2a6c);
        scene.fog = new THREE.Fog(0x1a2a6c, 10, 30);
        
        // Configuração da câmera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 5);
        
        // Configuração do renderizador
        const renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById('renderCanvas'),
            antialias: true,
            powerPreference: "low-power"
        });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        
        // Controles de órbita
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 1;
        controls.maxDistance = 10;
        controls.enablePan = true;
        
        // Luzes
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(3, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // Carregar modelo GLTF
        const loader = new THREE.GLTFLoader();
        let model = null;
        
        // Modelo otimizado para dispositivos móveis (astronauta)
        const MODEL_URL = './CalcitaPancakeBase.glb';
        
        // Elementos da UI
        const loadingElement = document.querySelector('.loading');
        const infoPanel = document.querySelector('.info-panel');
        const resetBtn = document.getElementById('resetBtn');
        const wireframeBtn = document.getElementById('wireframeBtn');
        const infoBtn = document.getElementById('infoBtn');
        
        // Carregar modelo
        loader.load(MODEL_URL, (gltf) => {
            model = gltf.scene;
            model.scale.set(0.8, 0.8, 0.8);
            model.position.y = -1;
            scene.add(model);
            
            // Esconder indicador de carregamento
            loadingElement.style.display = 'none';
            
            // Calcular estatísticas
            calculateModelStats();
            
        }, undefined, (error) => {
            console.error('Erro ao carregar modelo:', error);
            loadingElement.innerHTML = '<div>Erro ao carregar o modelo. Tente recarregar a página.</div>';
        });
        
        // Calcular estatísticas do modelo
        function calculateModelStats() {
            if (!model) return;
            
            let vertexCount = 0;
            let triangleCount = 0;
            let materialCount = 0;
            let textureCount = 0;
            
            const materialSet = new Set();
            const textureSet = new Set();
            
            model.traverse((child) => {
                if (child.isMesh) {
                    const geometry = child.geometry;
                    
                    if (geometry) {
                        vertexCount += geometry.attributes.position.count;
                        
                        if (geometry.index) {
                            triangleCount += geometry.index.count / 3;
                        } else {
                            triangleCount += geometry.attributes.position.count / 3;
                        }
                    }
                    
                    if (child.material) {
                        materialSet.add(child.material);
                        
                        // Verificar texturas
                        for (const key in child.material) {
                            const value = child.material[key];
                            if (value && value.isTexture) {
                                textureSet.add(value);
                            }
                        }
                    }
                }
            });
            
            document.getElementById('vertex-count').textContent = vertexCount.toLocaleString();
            document.getElementById('triangle-count').textContent = triangleCount.toLocaleString();
            document.getElementById('material-count').textContent = materialSet.size;
            document.getElementById('texture-count').textContent = textureSet.size;
        }
        
        // Event listeners para controles
        resetBtn.addEventListener('click', () => {
            controls.reset();
            camera.position.set(0, 1, 5);
        });
        
        wireframeBtn.addEventListener('click', () => {
            if (!model) return;
            
            model.traverse((child) => {
                if (child.isMesh) {
                    child.material.wireframe = !child.material.wireframe;
                }
            });
            
            wireframeBtn.innerHTML = wireframeBtn.innerHTML.includes('ON') ? 
                '<i>▦</i> Wireframe' : '<i>▦</i> Wireframe ON';
        });
        
        infoBtn.addEventListener('click', () => {
            infoPanel.style.display = infoPanel.style.display === 'block' ? 'none' : 'block';
        });
        
        // Atualizar tamanho do renderizador na mudança de janela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Função de animação
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            
            // Animar modelo levemente
            if (model) {
                model.rotation.y += 0.001;
            }
        }
        
        // Iniciar animação
        animate();
        
        // Otimizações para dispositivos móveis
        function handleMobileOptimizations() {
            // Reduzir qualidade em dispositivos móveis
            if ('ontouchstart' in window || navigator.maxTouchPoints) {
                renderer.setPixelRatio(1);
                scene.fog.near = 5;
                scene.fog.far = 20;
                
                // Desativar sombras para melhor desempenho
                directionalLight.castShadow = false;
            }
        }
        
        handleMobileOptimizations();
    </script>
</body>
</html>
