<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Visualizador 3D</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:system-ui,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================
MODEL VIEWER
========================= */

model-viewer{
  width:100vw;
  height:100vh;

  background:#000;

  --progress-bar-color:#4285f4;
  --progress-bar-height:3px;

  touch-action:none;
}

/* =========================
BOTÃO AR
========================= */

#ar-button{
  position:absolute;

  left:50%;
  transform:translateX(-50%);

  bottom:18px;

  display:flex;
  align-items:center;
  gap:10px;

  height:44px;

  padding:0 18px;

  border:none;
  border-radius:999px;

  background:rgba(255,255,255,.95);

  color:#4285f4;

  font-size:14px;
  font-weight:600;

  box-shadow:0 4px 16px rgba(0,0,0,.25);

  backdrop-filter:blur(10px);

  z-index:30;

  cursor:pointer;
}

#ar-button img{
  width:20px;
  height:20px;
}

#ar-button:active{
  transform:translateX(-50%) scale(.96);
}

/* =========================
PROMPT AR
========================= */

@keyframes orbit{
  from{
    transform:rotate(0deg) translateX(42px) rotate(0deg);
  }
  to{
    transform:rotate(360deg) translateX(42px) rotate(-360deg);
  }
}

#ar-prompt{
  position:absolute;

  left:50%;
  bottom:120px;

  transform:translateX(-50%);

  display:none;

  z-index:20;
}

model-viewer[ar-status="session-started"] #ar-prompt{
  display:block;
}

#ar-prompt img{
  width:56px;
  height:56px;

  animation:orbit 3s linear infinite;
}

/* =========================
ERRO TRACKING
========================= */

#ar-failure{
  position:absolute;

  left:50%;
  transform:translateX(-50%);

  bottom:86px;

  display:none;

  padding:10px 16px;

  border:none;
  border-radius:999px;

  background:rgba(0,0,0,.82);

  color:#ffb066;

  font-size:13px;
  font-weight:500;

  backdrop-filter:blur(6px);

  z-index:20;
}

model-viewer[ar-tracking="not-tracking"] #ar-failure{
  display:block;
}

/* =========================
SLIDER
========================= */

.slider{
  position:absolute;

  right:14px;
  bottom:78px;

  max-width:90vw;

  z-index:10;

  pointer-events:none;
}

.slides{
  display:flex;
  gap:10px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:6px;

  scrollbar-width:none;

  pointer-events:auto;
}

.slides::-webkit-scrollbar{
  display:none;
}

/* =========================
THUMBNAILS
========================= */

.slide{
  width:68px;
  height:68px;

  flex-shrink:0;

  border:none;
  border-radius:16px;

  background-size:cover;
  background-position:center;
  background-color:#222;

  border:2px solid rgba(255,255,255,.18);

  box-shadow:0 4px 12px rgba(0,0,0,.35);

  transition:
    transform .15s ease,
    border-color .15s ease;

  cursor:pointer;
}

.slide.selected{
  border:3px solid #4285f4;
  transform:scale(1.04);
}

.slide:active{
  transform:scale(.95);
}

/* =========================
RESPONSIVO
========================= */

@media (max-width:600px){

  .slide{
    width:58px;
    height:58px;
  }

  .slider{
    bottom:72px;
    right:10px;
  }

  #ar-button{
    bottom:14px;
    height:40px;
    font-size:13px;
  }

}

</style>
</head>

<body>

<model-viewer
  id="viewer"

  src="./models/CalcitaPancakeBase.glb"
  poster="./models/Calcita.png"

  ar
  ar-modes="webxr scene-viewer quick-look"

  camera-controls

  exposure="0"

  shadow-intensity="0"
  shadow-softness="0"

  environment-image="neutral"

  tone-mapping="neutral"

  interaction-prompt="none"

  disable-pan

  alt="Modelo 3D interativo"
>

  <!-- BOTÃO AR -->

  <button slot="ar-button" id="ar-button">
    <img src="https://fonts.gstatic.com/s/i/googlematerialicons/view_in_ar/v13/24px.svg">
    Ver no seu espaço
  </button>

  <!-- PROMPT AR -->

  <div id="ar-prompt">
    <img src="https://modelviewer.dev/shared-assets/icons/hand.png">
  </div>

  <!-- ERRO AR -->

  <button id="ar-failure">
    AR não detectado
  </button>

  <!-- THUMBNAILS -->

  <div class="slider">
    <div class="slides" id="slides"></div>
  </div>

</model-viewer>

<script type="module">

/* =========================
LISTA DE MODELOS
========================= */

const MODELS = [

  {
    name:'Calcita',
    glb:'./models/CalcitaPancakeBase.glb',
    poster:'./models/Calcita.png'
  },

  {
    name:'Robô',
    glb:'https://modelviewer.dev/shared-assets/models/RobotExpressive.glb',
    poster:'https://modelviewer.dev/shared-assets/models/RobotExpressive.webp'
  },

  {
    name:'Cavalo',
    glb:'https://modelviewer.dev/shared-assets/models/Horse.glb',
    poster:'https://modelviewer.dev/shared-assets/models/Horse.webp'
  }

];

/* =========================
ELEMENTOS
========================= */

const viewer = document.getElementById('viewer');
const slides = document.getElementById('slides');

let currentIndex = 0;

/* =========================
CRIAR THUMBNAILS
========================= */

MODELS.forEach((model,index)=>{

  const btn = document.createElement('button');

  btn.className = 'slide';

  if(index === 0){
    btn.classList.add('selected');
  }

  btn.style.backgroundImage = `url(${model.poster})`;

  btn.title = model.name;

  btn.setAttribute('aria-label',model.name);

  btn.addEventListener('click',()=>{

    if(currentIndex === index) return;

    currentIndex = index;

    /* remove poster anterior */

    viewer.dismissPoster();

    /* troca modelo */

    viewer.src = model.glb;
    viewer.poster = model.poster;

    /* reseta câmera */

    viewer.cameraOrbit = '0deg 75deg auto';

    /* atualiza thumb */

    document.querySelectorAll('.slide')
      .forEach(el=>el.classList.remove('selected'));

    btn.classList.add('selected');

  });

  slides.appendChild(btn);

});

/* =========================
FIX XR
========================= */

document.querySelector('.slider')
.addEventListener('beforexrselect',(e)=>{
  e.preventDefault();
});

/* =========================
VERIFICA AR
========================= */

window.addEventListener('load', async()=>{

  await customElements.whenDefined('model-viewer');

  const supported = await viewer.canActivateAR;

  if(!supported){

    console.warn('AR não suportado');

    document.getElementById('ar-button').style.display='none';

  }else{

    console.log('AR suportado');

  }

});

</script>

</body>
</html>
