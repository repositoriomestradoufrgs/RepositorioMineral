<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Ateliê 3D | Visualizador e Catálogo de Modelos</title>
    <!-- TailwindCSS + Fontes modernas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    animation: { 'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>
    <style>
        /* Estilos complementares para line-clamp e transições suaves */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* remover outline padrão de botões no foco, mas manter acessibilidade */
        button:focus-visible {
            outline: 2px solid #6366f1;
            outline-offset: 2px;
        }
        /* transição fluida para cartões e sobreposições */
        .card-hover-effect {
            transition: transform 0.25s ease, box-shadow 0.3s ease;
        }
        /* barra de progresso personalizada (carregamento 3D) */
        .loading-progress {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
        }
        /* esconder scrollbar desnecessária no canvas container */
        #viewer-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 antialiased">

    <!-- ========== CATÁLOGO / GALERIA ========== -->
    <div id="catalog-view" class="min-h-screen w-full px-4 py-8 md:py-12 lg:py-16 transition-all duration-300">
        <div class="max-w-7xl mx-auto">
            <div class="text-center mb-10 md:mb-14">
                <h1 class="text-4xl md:text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-300 via-indigo-200 to-purple-200 tracking-tight">
                    🧊 Galeria Imersiva
                </h1>
                <p class="text-indigo-100/70 mt-3 text-lg max-w-2xl mx-auto">
                    Selecione qualquer modelo para explorar em 3D com controles orbitais e alta fidelidade visual.
                </p>
            </div>
            <div id="model-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-7 auto-rows-fr">
                <!-- Os cartões serão injetados via JS -->
            </div>
        </div>
    </div>

    <!-- ========== VISUALIZADOR 3D ========== -->
    <div id="viewer-container" class="hidden fixed inset-0 w-full h-full z-50 bg-black/95 backdrop-blur-sm transition-all">
        <!-- Barra superior com controles -->
        <div class="absolute top-0 left-0 right-0 flex flex-wrap items-center justify-between gap-3 p-4 z-20 bg-gradient-to-b from-gray-900/80 to-transparent pointer-events-none">
            <div class="pointer-events-auto">
                <button id="back-button" class="bg-gray-800/90 hover:bg-indigo-600 text-white font-semibold py-2.5 px-5 rounded-xl shadow-lg backdrop-blur-md transition-all duration-200 flex items-center gap-2 border border-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                    <span>Catálogo</span>
                </button>
            </div>
            <div class="pointer-events-auto flex gap-3">
                <button id="reset-camera-btn" class="bg-gray-800/80 hover:bg-indigo-500 text-white text-sm font-medium py-2 px-4 rounded-xl backdrop-blur-md transition shadow-md border border-white/20">
                    🎥 Centralizar câmera
                </button>
            </div>
        </div>

        <!-- Status messages: loading & error -->
        <div id="status-messages" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 pointer-events-none flex flex-col items-center gap-2 w-full max-w-md px-4">
            <div id="loading-status" class="hidden loading-progress text-white px-5 py-2 rounded-full font-mono text-sm backdrop-blur-md bg-black/60 border border-indigo-400/40 shadow-lg">
                <span id="loading-text">⏳ Carregando modelo...</span>
            </div>
            <div id="error-status" class="hidden bg-red-900/90 backdrop-blur-md border border-red-400 text-red-100 px-5 py-2 rounded-xl font-medium text-sm shadow-xl pointer-events-auto">
                ⚠️ <span id="error-message">Erro ao carregar</span>
            </div>
        </div>

        <!-- pequena legenda de ajuda -->
        <div class="absolute bottom-4 right-4 text-white/40 text-xs bg-black/30 rounded-full px-3 py-1 backdrop-blur-sm pointer-events-none z-20">
            🖱️ Arrastar: orbitar | Clique + arrastar: girar
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/DRACOLoader.js';

        // --------------------------------------------------------------
        // 1. BASE DE DADOS DOS MODELOS (caminhos relativos + fallbacks)
        // --------------------------------------------------------------
        const MODELS_CATALOG = [
            {
                id: 'calcita_original',
                name: '✨ Calcita Original',
                gltfUrl: './CalcitaPancakeBase.glb',
                thumbnailUrl: './images/calcita_original.png',
                description: 'Geometria orgânica com alta exposição e detalhes minerais.'
            },
            {
                id: 'apf1_robot',
                name: '🤖 APF1 - Robô Avançado',
                gltfUrl: './models/APF1-v1.glb',
                thumbnailUrl: './images/APF1-v1.png',
                description: 'Design mecanizado com acabamento metálico e articulações.'
            },
            {
                id: 'flight_helmet',
                name: '⛑️ Capacete de Voo',
                gltfUrl: './models/FlightHelmet.gltf',
                thumbnailUrl: './images/capacete_voo.png',
                description: 'Modelo PBR realista, texturas de alta resolução.'
            },
            {
                id: 'viking_room',
                name: '🏛️ Sala Viking',
                gltfUrl: './models/VikingRoom.gltf',
                thumbnailUrl: './images/sala_viking.png',
                description: 'Ambiente completo com iluminação indireta e móveis rústicos.'
            }
        ];

        // Elementos DOM
        const catalogView = document.getElementById('catalog-view');
        const viewerContainer = document.getElementById('viewer-container');
        const modelGrid = document.getElementById('model-grid');
        const backBtn = document.getElementById('back-button');
        const resetCamBtn = document.getElementById('reset-camera-btn');
        const loadingStatusDiv = document.getElementById('loading-status');
        const loadingTextSpan = document.getElementById('loading-text');
        const errorStatusDiv = document.getElementById('error-status');
        const errorMessageSpan = document.getElementById('error-message');

        // Estado THREE
        let scene, camera, renderer, orbitControls;
        let activeModelObject = null;      // grupo principal do modelo carregado
        let currentLoadRequestId = 0;      // para evitar race conditions
        let animationFrameId = null;
        
        // luzes globais (reutilizáveis)
        let ambientLight, mainLight, fillLight, backRimLight;

        // flags de inicialização
        let isThreeInitialized = false;

        // --------------------------------------------------------------
        // 2. FUNÇÕES DE UI / Navegação
        // --------------------------------------------------------------
        function showCatalog() {
            // Oculta visualizador e exibe catálogo
            viewerContainer.classList.add('hidden');
            catalogView.classList.remove('hidden');
            
            // Para animação e limpa recursos Three.js corretamente
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            
            if (renderer) {
                // remove canvas do DOM para liberar memória
                if (renderer.domElement && renderer.domElement.parentNode) {
                    renderer.domElement.remove();
                }
                renderer.dispose();
                renderer = null;
            }
            
            // limpar referências pesadas
            if (scene) {
                scene.clear();
                scene = null;
            }
            if (orbitControls) {
                orbitControls.dispose();
                orbitControls = null;
            }
            camera = null;
            isThreeInitialized = false;
            activeModelObject = null;
            
            // esconde mensagens de erro
            errorStatusDiv.classList.add('hidden');
            loadingStatusDiv.classList.add('hidden');
        }

        function showViewer(modelUrl) {
            // Oculta catálogo, mostra container 3D
            catalogView.classList.add('hidden');
            viewerContainer.classList.remove('hidden');
            
            // reset de status
            errorStatusDiv.classList.add('hidden');
            loadingStatusDiv.classList.remove('hidden');
            loadingTextSpan.innerHTML = '🔄 Inicializando ambiente 3D...';
            
            // Incrementa requestId para evitar sobreposição de loads antigos
            const requestId = ++currentLoadRequestId;
            
            // Inicializa o motor Three (caso não exista)
            initThreeEnvironment();
            
            // Carrega modelo com validação de race
            loadModelWithRetry(modelUrl, requestId);
        }

        // --------------------------------------------------------------
        // 3. SETUP THREE.JS (com correções para r136)
        // --------------------------------------------------------------
        function initThreeEnvironment() {
            if (isThreeInitialized && renderer && scene) return;
            
            // Cena principal com fundo cinza suave (elegante para destacar modelos)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111217); // tom dark sofisticado
            scene.environment = null; // sem env map externo para manter performance
            
            // Câmera perspectiva
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(1.2, 1.4, 2.8);
            
            // Renderizador com correções: outputColorSpace, tone mapping
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x111217, 1.0);
            // CORREÇÃO CRÍTICA: substituir outputEncoding obsoleto
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.65; // exposição agradável para destacar detalhes
            renderer.shadowMap.enabled = false;   // performance mantida, sem sombras para maior suavidade
            
            // Adiciona canvas ao container
            viewerContainer.appendChild(renderer.domElement);
            
            // Orbit Controls com suavidade
            orbitControls = new OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.06;
            orbitControls.rotateSpeed = 1.2;
            orbitControls.zoomSpeed = 1.2;
            orbitControls.panSpeed = 0.8;
            orbitControls.enableZoom = true;
            orbitControls.enablePan = true;
            orbitControls.target.set(0, 0, 0);
            
            // ----- SISTEMA DE LUZES PROFISSIONAL (modelos PBR) -----
            // Luz ambiente neutra e intensa
            ambientLight = new THREE.AmbientLight(0xffffff, 0.98);
            scene.add(ambientLight);
            
            // Luz direcional principal (quente, vinda de cima-esquerda)
            mainLight = new THREE.DirectionalLight(0xfff5e0, 2.4);
            mainLight.position.set(3.5, 5.2, 2.8);
            scene.add(mainLight);
            
            // Luz de preenchimento lateral fria
            fillLight = new THREE.DirectionalLight(0xbbddff, 1.2);
            fillLight.position.set(-2.5, 1.8, -2.2);
            scene.add(fillLight);
            
            // Luz de rebote traseira (rim light) para destacar bordas
            backRimLight = new THREE.DirectionalLight(0xffaa88, 1.0);
            backRimLight.position.set(0, 1.5, -3.2);
            scene.add(backRimLight);
            
            // pequeno ponto de luz auxiliar suave
            const softFill = new THREE.PointLight(0x6688aa, 0.5);
            softFill.position.set(1, 1.2, 1.5);
            scene.add(softFill);
            
            // (Opcional) grade auxiliar muito sutil para referência espacial - sem distrair
            const gridHelper = new THREE.GridHelper(5, 20, 0x8899aa, 0x445566);
            gridHelper.position.y = -0.9;
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.2;
            scene.add(gridHelper);
            
            // eixo invisivel apenas para referencia (não adicionar poluição visual)
            isThreeInitialized = true;
            
            // Inicia o loop de animação
            startAnimationLoop();
        }
        
        function startAnimationLoop() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            function animate() {
                animationFrameId = requestAnimationFrame(animate);
                if (orbitControls) orbitControls.update();
                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                }
            }
            animate();
        }
        
        // --------------------------------------------------------------
        // 4. CARREGAMENTO DO MODELO COM DRACO + CENTRALIZAÇÃO AUTOMÁTICA
        // --------------------------------------------------------------
        function loadModelWithRetry(modelUrl, requestId) {
            // Remove modelo anterior, se existir
            if (activeModelObject) {
                scene.remove(activeModelObject);
                activeModelObject = null;
            }
            
            // Mostra loading progressivo
            loadingTextSpan.innerHTML = '📦 Carregando geometria 3D...';
            
            // Configurar DracoLoader (compatível com glb comprimido)
            const dracoLoader = new DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
            
            const loader = new GLTFLoader();
            loader.setDRACOLoader(dracoLoader);
            
            loader.load(modelUrl, 
                (gltf) => {
                    // Verifica se este request ainda é o último solicitado
                    if (requestId !== currentLoadRequestId) {
                        console.warn("Load ignorado: modelo desatualizado");
                        return;
                    }
                    
                    const modelGroup = gltf.scene;
                    
                    // Ajuste de materiais para maior realce e estabilidade PBR
                    modelGroup.traverse((child) => {
                        if (child.isMesh) {
                            // melhora a resposta visual dos materiais
                            if (child.material) {
                                // tratar array de materiais
                                const materials = Array.isArray(child.material) ? child.material : [child.material];
                                materials.forEach(mat => {
                                    if (mat) {
                                        mat.metalness = Math.min(mat.metalness ?? 0.2, 0.85);
                                        mat.roughness = Math.max(mat.roughness ?? 0.4, 0.2);
                                        mat.envMapIntensity = 0.45;
                                        if (mat.map) mat.map.anisotropy = 16;
                                        mat.needsUpdate = true;
                                    }
                                });
                            }
                        }
                    });
                    
                    // Centralizar modelo: calcular bounding box e mover para origem
                    const bbox = new THREE.Box3().setFromObject(modelGroup);
                    const center = bbox.getCenter(new THREE.Vector3());
                    const size = bbox.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    // reposiciona modelo para que o centro geométrico fique em (0,0,0)
                    modelGroup.position.sub(center);
                    
                    // Adiciona à cena
                    scene.add(modelGroup);
                    activeModelObject = modelGroup;
                    
                    // Ajuste inteligente da câmera baseado no tamanho do modelo
                    const distance = Math.max(maxDim * 1.3, 1.2);
                    // Define nova posição da câmera de forma elegante
                    const direction = new THREE.Vector3(1, 0.8, 1.2).normalize();
                    camera.position.set(direction.x * distance, direction.y * distance * 0.9, direction.z * distance);
                    orbitControls.target.set(0, 0, 0);
                    orbitControls.update();
                    
                    // Feedback de sucesso
                    loadingStatusDiv.classList.add('hidden');
                    errorStatusDiv.classList.add('hidden');
                    
                    // pequeno efeito visual de transição (apenas estético)
                    setTimeout(() => {
                        if (renderer) renderer.setClearColor(0x111217);
                    }, 50);
                },
                (xhr) => {
                    if (requestId !== currentLoadRequestId) return;
                    const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                    loadingTextSpan.innerHTML = `⏳ Carregando: ${percent}%`;
                },
                (error) => {
                    if (requestId !== currentLoadRequestId) return;
                    console.error('Erro no carregamento do modelo:', error);
                    let friendlyMsg = "Falha ao carregar o modelo. Verifique se o arquivo existe ou tente outro modelo.";
                    if (error.message) friendlyMsg = error.message.length > 80 ? error.message.slice(0,80)+'...' : error.message;
                    errorMessageSpan.innerText = friendlyMsg;
                    errorStatusDiv.classList.remove('hidden');
                    loadingStatusDiv.classList.add('hidden');
                    
                    // Insere um objeto placeholder visual apenas para não ficar tela vazia
                    if (activeModelObject) scene.remove(activeModelObject);
                    const placeholderGroup = new THREE.Group();
                    const geometry = new THREE.SphereGeometry(0.45, 32, 32);
                    const material = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x330000, roughness: 0.3, metalness: 0.1 });
                    const errorSphere = new THREE.Mesh(geometry, material);
                    placeholderGroup.add(errorSphere);
                    const wireframeGeo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
                    const wireframeMat = new THREE.MeshBasicMaterial({ color: 0xff8888, wireframe: true, transparent: true });
                    const wireBox = new THREE.Mesh(wireframeGeo, wireframeMat);
                    placeholderGroup.add(wireBox);
                    scene.add(placeholderGroup);
                    activeModelObject = placeholderGroup;
                    orbitControls.target.set(0,0,0);
                    orbitControls.update();
                }
            );
        }
        
        // Ajuste de câmera para visualização ideal (reset)
        function resetCameraToModel() {
            if (!activeModelObject) {
                // fallback genérico
                camera.position.set(1.5, 1.2, 2.8);
                orbitControls.target.set(0, 0, 0);
                orbitControls.update();
                return;
            }
            // recalcular bounding box do modelo atual
            const bbox = new THREE.Box3().setFromObject(activeModelObject);
            const size = bbox.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const distance = Math.max(maxDim * 1.2, 1.4);
            const direction = new THREE.Vector3(0.8, 0.6, 1.2).normalize();
            camera.position.set(direction.x * distance, direction.y * distance * 0.9, direction.z * distance);
            orbitControls.target.set(0, 0, 0);
            orbitControls.update();
        }
        
        // --------------------------------------------------------------
        // 5. GERADOR DE CARDS (thumbnails com fallback elegante)
        // --------------------------------------------------------------
        function generateModelCards() {
            modelGrid.innerHTML = '';
            MODELS_CATALOG.forEach(model => {
                const card = document.createElement('div');
                card.className = 'group bg-white/10 backdrop-blur-md rounded-2xl overflow-hidden shadow-xl hover:shadow-2xl transition-all duration-300 hover:scale-[1.02] cursor-pointer border border-white/20 hover:border-indigo-400/60';
                card.onclick = () => showViewer(model.gltfUrl);
                
                // miniatura com fallback robusto
                const imgFallback = `https://placehold.co/400x300/2d2a4a/bbbbff?text=${encodeURIComponent(model.name)}+3D`;
                card.innerHTML = `
                    <div class="relative h-52 overflow-hidden bg-gradient-to-br from-gray-800 to-gray-900">
                        <img src="${model.thumbnailUrl}" alt="${model.name}" 
                             class="w-full h-full object-cover transition duration-500 group-hover:scale-105"
                             onerror="this.onerror=null; this.src='${imgFallback}'; this.classList.add('opacity-80');">
                        <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition"></div>
                    </div>
                    <div class="p-5">
                        <h3 class="text-xl font-bold text-white tracking-tight">${model.name}</h3>
                        <p class="text-indigo-100/70 text-sm mt-2 line-clamp-2">${model.description}</p>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-indigo-300 text-xs font-mono">🔍 GLTF/GLB</span>
                            <button class="bg-indigo-500/90 hover:bg-indigo-600 text-white text-sm font-medium py-2 px-4 rounded-xl transition shadow-md backdrop-blur-sm">
                                Visualizar →
                            </button>
                        </div>
                    </div>
                `;
                modelGrid.appendChild(card);
            });
        }
        
        // --------------------------------------------------------------
        // 6. EVENTOS GLOBAIS & RESPONSIVIDADE
        // --------------------------------------------------------------
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
        
        // Botão Voltar ao catálogo (completo)
        backBtn.addEventListener('click', () => {
            showCatalog();
        });
        
        // Reset de câmera dentro do visualizador
        resetCamBtn.addEventListener('click', () => {
            if (isThreeInitialized && activeModelObject) {
                resetCameraToModel();
                // também exibir pequeno feedback momentâneo
                const tempMsg = document.createElement('div');
                tempMsg.innerText = '✓ Câmera reajustada';
                tempMsg.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 bg-black/70 text-white px-4 py-1.5 rounded-full text-sm z-30 pointer-events-none backdrop-blur-sm';
                document.body.appendChild(tempMsg);
                setTimeout(() => tempMsg.remove(), 1200);
            } else if (camera && orbitControls) {
                camera.position.set(1.2, 1.2, 2.5);
                orbitControls.target.set(0,0,0);
                orbitControls.update();
            }
        });
        
        // --------------------------------------------------------------
        // 7. INICIALIZAÇÃO DO CATÁLOGO
        // --------------------------------------------------------------
        generateModelCards();
        
        // Pré-carregamento (caso o primeiro acesso seja suave)
        console.log('📌 Aplicação 3D catálogo pronta. Clique nos cards para explorar modelos.');
        
        // tratamento para evitar scroll duplicado em mobile
        viewerContainer.addEventListener('touchmove', (e) => {
            if (viewerContainer.classList.contains('hidden')) return;
            e.stopPropagation();
        }, { passive: false });
        
        // Ao fechar o visualizador, garantir que o Three pare de consumir GPU desnecessariamente
        window.addEventListener('beforeunload', () => {
            if (renderer) renderer.dispose();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        });
    </script>
</body>
</html>
