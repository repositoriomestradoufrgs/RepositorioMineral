<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galeria 3D | Visualizador de Modelos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #ff8c00, #ff2e6e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            color: #ccc;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            justify-items: center;
            align-items: stretch;
        }

        .card {
            background: rgba(30, 30, 50, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            animation: fadeInUp 0.6s ease backwards;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.4);
            border-color: rgba(255,140,0,0.5);
        }

        .thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f0f1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .thumbnail img {
            transform: scale(1.05);
        }

        .card-info {
            padding: 1.5rem;
            text-align: center;
        }

        .card-info h3 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: #ffaa44;
        }

        .card-info p {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .badge {
            display: inline-block;
            background: rgba(255,140,0,0.2);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 0.8rem;
            color: #ffaa66;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding: 1.5rem;
            font-size: 0.8rem;
            opacity: 0.6;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-message {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            color: #ffaa44;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            .grid {
                gap: 1.2rem;
            }
        }
    </style>
    <!-- Carregar a lista de modelos -->
    <script src="models.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Galeria 3D Interativa</h1>
            <p class="subtitle">Clique em qualquer modelo para visualizar em 360° e com zoom</p>
        </header>

        <div class="grid" id="models-grid">
            <div class="loading-message">Carregando modelos...</div>
        </div>

        <footer>
            <p>Modelos GLB/GLTF | Arraste para girar | Role para ampliar</p>
            <p>Adicione seus próprios modelos editando o arquivo <strong>models.js</strong></p>
        </footer>
    </div>

    <script>
        // Aguarda o DOM e a lista de modelos
        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('models-grid');
            
            // Verifica se a lista de modelos existe (vinda do models.js)
            if (typeof window.modelsList === 'undefined' || window.modelsList.length === 0) {
                gridContainer.innerHTML = '<div class="loading-message">⚠️ Nenhum modelo encontrado. Verifique o arquivo models.js</div>';
                return;
            }

            // Gerar os cards dinamicamente
            let cardsHTML = '';
            window.modelsList.forEach(model => {
                // Gera uma URL de thumbnail usando placeholder com o nome do modelo
                const thumbnailUrl = `https://placehold.co/600x400/1e1e32/ffaa44?text=${encodeURIComponent(model.name)}&font=montserrat`;
                
                cardsHTML += `
                    <div class="card" data-id="${model.id}">
                        <div class="thumbnail">
                            <img src="${thumbnailUrl}" alt="${model.name}" loading="lazy">
                        </div>
                        <div class="card-info">
                            <h3>${model.name}</h3>
                            <p>Formato: ${model.modelUrl.endsWith('.glb') ? 'GLB' : 'GLTF'}</p>
                            <div class="badge">🔍 Clique para explorar</div>
                        </div>
                    </div>
                `;
            });
            gridContainer.innerHTML = cardsHTML;

            // Adicionar evento de clique em cada card
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const modelId = card.getAttribute('data-id');
                    // Redireciona para a página do visualizador com o ID do modelo
                    window.location.href = `viewer.html?id=${modelId}`;
                });
            });
        });
    </script>
</body>
</html>
