<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Imersivo</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Importando a biblioteca model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="viewer-page">
    <nav>
        <a href="index.html" class="back-button">← Voltar ao Catálogo</a>
        <h2 id="model-name">Carregando Modelo...</h2>
    </nav>

    <div class="viewer-container">
        <!-- O componente de visualização -->
        <model-viewer 
            id="dynamic-viewer" 
            alt="Modelo 3D" 
            auto-rotate 
            camera-controls 
            shadow-intensity="1"
            exposure="1.2">
        </model-viewer>
    </div>

    <script>
        // Lógica para capturar o modelo correto da URL
        const urlParams = new URLSearchParams(window.location.search);
        const modelFile = urlParams.get('model');
        const modelName = urlParams.get('name');

        if (modelFile) {
            const viewer = document.getElementById('dynamic-viewer');
            viewer.src = `models/${modelFile}`; // Aponta para a pasta models
            
            document.getElementById('model-name').textContent = modelName || 'Visualização 3D';
        } else {
            document.getElementById('model-name').textContent = 'Erro: Modelo não especificado.';
        }
    </script>
</body>
</html>
